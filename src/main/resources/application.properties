spring.application.name=MasterMind
// Conexión a la base de datos MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/mastermind_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

//JPA / Hibernate para auto-crear las tablas
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true